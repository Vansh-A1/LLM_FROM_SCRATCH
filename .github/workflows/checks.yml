name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate source, documentation, and published artifacts
        run: python scripts/check_repository.py
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.2 tiktoken==0.14.0
      - name: Exercise model and checkpoint invariants on CPU
        run: python gpt2/train.py --smoke-test --device cpu
